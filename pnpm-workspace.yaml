packages:
  - apps/*
  - packages/*

# React Native / Metro works most reliably with a flat node_modules.
nodeLinker: hoisted

# Expo and Next.js must share a single copy of React in a hoisted install.
overrides:
  react: 19.2.3
  react-dom: 19.2.3

allowBuilds:
  sharp: false
  unrs-resolver: false
  supabase: true

minimumReleaseAgeExclude:
  - lucide-react@1.52.0
